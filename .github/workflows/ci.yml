name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python benchmark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The real-data tests need the QA-PBP-RL-Nexus Potts files, which are not
      # committed. They are skipped automatically when the directory is absent;
      # the rest of the suite still runs.
      - name: Run pytest
        run: python -m pytest -q

  web:
    name: Web app typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test

      - name: Report measured assertion count
        run: npm run assertions

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: qbind-select-dist
          path: web/dist
          retention-days: 7

# A deploy job is intentionally NOT defined here. Publishing requires the
# repository owner to enable GitHub Pages (Settings -> Pages -> Source ->
# GitHub Actions); the workflow that does it lives in pages.yml and has never
# been executed. Keeping deployment out of CI means a green build never
# publishes anything by surprise.
