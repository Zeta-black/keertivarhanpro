# Publishes web/dist to GitHub Pages.
#
# THIS WORKFLOW HAS NOT BEEN RUN. It requires the repository owner to enable
# Pages first: Settings -> Pages -> Build and deployment -> Source -> GitHub
# Actions. Until that is done the job will fail at the configure-pages step.
#
# QBIND_BASE is derived from the repository name because a project site is
# served from https://<owner>.github.io/<repo>/ rather than from a domain root.
# Without it every asset request 404s.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel an in-flight one instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Typecheck and test
        working-directory: ./web
        run: |
          npx tsc --noEmit
          npm test

      - name: Build with the correct base path
        working-directory: ./web
        env:
          QBIND_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages has no Jekyll opt-out by default and will drop paths it treats as
      # private; .nojekyll disables that processing entirely.
      - name: Disable Jekyll processing
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
